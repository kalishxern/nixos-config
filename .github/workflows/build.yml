name: NixOS

on:
  workflow_dispatch:
  push:
    branches:
      - build

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    env:
      NIXPKGS_ALLOW_UNFREE: 1
      NIXPKGS_ALLOW_INSECURE: 1

    steps:
      - name: CPU
        run: lscpu ;grep "model name" /proc/cpuinfo

      - name: Free-disk-space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: RAM
        run: sudo apt-get update ;if sudo apt-get install --yes "linux-modules-extra-$(uname -r)" && sudo modprobe zram ;then sudo apt-get install -y zram-tools ;{ echo 'ALGO=lz4' ;echo 'PERCENT=200' ;echo 'PRIORITY=32766' ;} > /tmp/zramswap ;sudo install -m 644 /tmp/zramswap /etc/default/zramswap ;sudo systemctl restart zramswap.service ;fi ;sudo swapoff -a ;sudo rm -f /swapfile ;sudo fallocate -l 4G /swapfile ;sudo chmod 600 /swapfile ;sudo mkswap /swapfile ;sudo swapon -p 16383 /swapfile ;swapon --show ;free -h

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Create missing /lib32
        run: sudo rm -f /lib32 ;sudo mkdir -p /lib32

      - uses: actions/checkout@main
        with:
          fetch-depth: 3

      - name: Prepare ccache dir
        run: sudo mkdir -p /var/cache/ccache ;sudo chown -R "$(id -u):$(id -g)" /var/cache/ccache ;sudo chmod -R 0755 /var/cache/ccache ;echo "CCACHE_DIR=/var/cache/ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache/restore@main
        with:
          path: /var/cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          restore-keys: "ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-\nccache-${{ runner.os }}-\n"

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: "sandbox = false\nmax-jobs = auto\ncores = 0\nmax-silent-time = 3600\nkeep-outputs = true\nkeep-derivations = true\nfallback = true\nhttp-connections = 128\nconnect-timeout = 15\nstalled-download-timeout = 15\n"

      - uses: cachix/cachix-action@master
        with:
          name: kalishxern-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build NixOS
        id: build
        run: set -euo pipefail ;echo "result=$(nix build .#nixosConfigurations.nixos.config.system.build.toplevel --extra-system-features gccarch-bdver3 --max-jobs 1 --cores 0 --accept-flake-config --option sandbox false --print-out-paths --show-trace --impure -L 2> >(tee "$RUNNER_TEMP/build.log" >&2))" >> "$GITHUB_OUTPUT"

      - name: Print full build logs
        if: always()
        run: set +e ;if test -f "$RUNNER_TEMP/build.log" ;then cat "$RUNNER_TEMP/build.log" ;fi ;set -e

      - name: Show logs of failed derivations
        if: always()
        run: set +e ;if test -f "$RUNNER_TEMP/build.log" ;then grep -oP '(?<=nix log )/nix/store/[^ ]+[.]drv' "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/drvs.txt" ;sort -u "$RUNNER_TEMP/drvs.txt" > "$RUNNER_TEMP/drvs-uniq.txt" ;while IFS= read -r d ;do nix log "$d" ;done < "$RUNNER_TEMP/drvs-uniq.txt" ;fi ;set -e

      - name: Upload-artifact full build logs
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: build-logs
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Explicitly push all dependencies to Cachix
        run: set +e ;if test -n "${{ steps.build.outputs.result }}" ;then nix path-info -r ${{ steps.build.outputs.result }} --impure 2>/dev/null > "$RUNNER_TEMP/deps.txt" ;cachix push kalishxern-nixos < "$RUNNER_TEMP/deps.txt" ;fi ;set -e

      - name: Save ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: /var/cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}

      - name: Cleanup old ccache entries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache list --key "ccache-${{ runner.os }}-" --limit 100 --json id,key,ref > "$RUNNER_TEMP/caches.json" ;python3 -c 'import json,sys ;data=json.load(open(sys.argv[1])) ;cur=sys.argv[2] ;print(chr(10).join(str(c["id"]) for c in data if cur not in c["key"]))' "$RUNNER_TEMP/caches.json" "${{ github.run_id }}" > "$RUNNER_TEMP/ids.txt" ;set +e ;while IFS= read -r id ;do if test -n "$id" ;then gh cache delete "$id" ;fi ;done < "$RUNNER_TEMP/ids.txt" ;set -e
