name: Build NixOS

on:
  workflow_dispatch:
  push:
    branches:
      - build

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NIXPKGS_ALLOW_UNFREE: 1
      NIXPKGS_ALLOW_INSECURE: 1
      COMPACT_FLAKE: github:ghuntley/nix-compact/main
      NIX_BUILD_LOG_DIR: /tmp/nix-build-logs

    steps:
      - name: Show runner CPU
        run: lscpu && grep "model name" /proc/cpuinfo

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Swap (zram + fallback swapfile)
        run: sudo apt-get update; if sudo apt-get install --yes "linux-modules-extra-$(uname -r)" && sudo modprobe zram; then sudo apt-get install -y zram-tools; echo -e "ALGO=lz4\nPERCENT=200\nPRIORITY=32766" | sudo tee /etc/default/zramswap; sudo systemctl restart zramswap.service; else echo "zram module unavailable this run, skipping"; fi; sudo rm -rf /swapfile && sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon -p 16383 /swapfile && swapon --show && free -h

      - name: Create missing /lib32
        run: sudo rm -f /lib32 && sudo mkdir -p /lib32

      - uses: actions/checkout@main
        with:
          fetch-depth: 3

      - name: Prepare ccache dir
        run: sudo mkdir -p /var/cache/ccache && sudo chown -R "$(id -u):$(id -g)" /var/cache/ccache && sudo chmod -R 0755 /var/cache/ccache && echo "CCACHE_DIR=/var/cache/ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache/restore@main
        with:
          path: /var/cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          restore-keys: "ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-\nccache-${{ runner.os }}-\n"

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: "sandbox = false\nmax-jobs = auto\ncores = 0\nmax-silent-time = 3600\nkeep-outputs = true\nkeep-derivations = true\nfallback = true\nhttp-connections = 128\nconnect-timeout = 15\nstalled-download-timeout = 15\nlog-lines = 300\n"

      - uses: cachix/cachix-action@master
        with:
          name: kalishxern-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Install nix-compact
        timeout-minutes: 90
        run: pkg=$(nix build $COMPACT_FLAKE#default.nix-cli^out --no-link --print-out-paths) && echo "PATCHED_NIX=$pkg/bin/nix" >> $GITHUB_ENV

      - name: Build NixOS configuration
        id: build
        run: r=$($PATCHED_NIX build .#nixosConfigurations.nixos.config.system.build.toplevel --extra-system-features gccarch-bdver3 --max-jobs 1 --cores 0 --accept-flake-config --option sandbox false --option log-lines 300 --print-out-paths --show-trace --impure) && echo "result=$r" >> $GITHUB_OUTPUT

      - name: Show build diagnostics
        if: always() && (steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled')
        run: $PATCHED_NIX build-log $NIX_BUILD_LOG_DIR/*.jsonl --diagnostics --limit 15 && $PATCHED_NIX build-log $NIX_BUILD_LOG_DIR/*.jsonl --diagnostic D1 --context 40

      - name: Upload full build log
        if: always() && (steps.build.outcome == 'failure' || steps.build.outcome == 'cancelled')
        uses: actions/upload-artifact@main
        with:
          name: nix-build-log
          path: ${{ env.NIX_BUILD_LOG_DIR }}
          retention-days: 7

      - name: Explicitly push all dependencies to Cachix
        run: nix path-info -r ${{ steps.build.outputs.result }} --impure 2>/dev/null | cachix push kalishxern-nixos || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: /var/cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}

      - name: Cleanup old ccache entries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache list --key "ccache-${{ runner.os }}-" --limit 100 --json id,key,ref | jq -r --arg current "${{ github.run_id }}" '.[] | select(.key | contains($current) | not) | .id' | xargs -r -n1 gh cache delete
