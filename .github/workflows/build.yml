name: Build NixOS

on:
  workflow_dispatch:
  push:
    branches:
      - build

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NIXPKGS_ALLOW_UNFREE: 1
      NIXPKGS_ALLOW_INSECURE: 1

    steps:
      - name: Show runner CPU
        run: |
          lscpu
          grep "model name" /proc/cpuinfo

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Swap (zram + fallback swapfile)
        run: |
          sudo apt-get update && sudo apt upgrade -y
          if sudo apt-get install --yes "linux-modules-extra-$(uname -r)" && sudo modprobe zram; then
            sudo apt-get install -y zram-tools
            echo -e "ALGO=lz4\nPERCENT=200\nPRIORITY=32766" | sudo tee /etc/default/zramswap
            sudo systemctl restart zramswap.service
          else
            echo "zram module unavailable this run, skipping"
          fi

          sudo rm -rf /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 16383 /swapfile

          swapon --show
          free -h

      - name: Create missing /lib32
        run: sudo rm -f /lib32 && sudo mkdir -p /lib32

      - uses: actions/checkout@main
        with:
          fetch-depth: 3

      - name: Prepare ccache dir
        run: |
          sudo mkdir -p /var/cache/ccache
          sudo chown -R "$(id -u):$(id -g)" /var/cache/ccache
          sudo chmod -R 0755 /var/cache/ccache
          echo "CCACHE_DIR=/var/cache/ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache/restore@main
        with:
          path: /var/cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
            ccache-${{ runner.os }}-

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
          extra-conf: |
            sandbox = false
            max-jobs = auto
            cores = 0
            max-silent-time = 3600
            keep-outputs = true
            keep-derivations = true
            fallback = true
            http-connections = 128
            connect-timeout = 15
            stalled-download-timeout = 15

      - uses: cachix/cachix-action@master
        with:
          name: kalishxern-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build NixOS configuration
        id: build
        run: set -euo pipefail; nix build .#nixosConfigurations.nixos.config.system.build.toplevel --extra-system-features gccarch-bdver3 --max-jobs 1 --cores 0 --accept-flake-config --option sandbox false --print-out-paths --show-trace --impure -L 2>&1 >"$RUNNER_TEMP/out-paths.txt" | tee "$RUNNER_TEMP/build.log"; echo "result=$(cat "$RUNNER_TEMP/out-paths.txt")" >> "$GITHUB_OUTPUT"

      - name: Collect logs of failed derivations
        if: failure() && steps.build.outcome == 'failure'
        run: set +e; log="$RUNNER_TEMP/build.log"; out="$RUNNER_TEMP/failed-logs"; mkdir -p "$out"; [ -f "$log" ] || { echo "No build output file found."; exit 0; }; tail -n 3000 "$log" > "$out/build-tail.log"; found=0; while IFS= read -r drv; do name=$(basename "$drv" .drv); if nix log "$drv" > "$out/$name.log" 2>/dev/null </dev/null && [ -s "$out/$name.log" ]; then found=$((found + 1)); echo "::error title=Failed derivation::$name"; grep -nE -m 5 -B 10 -A 15 'error:|ERROR|\*\*\*.*Error [0-9]+|[Kk]illed|No space left|[Oo]ut of memory|undefined reference|Segmentation fault|FAILED|Failed to|fatal:' "$out/$name.log" > "$out/$name.errors.txt" || tail -n 60 "$out/$name.log" > "$out/$name.errors.txt"; cat "$out/$name.errors.txt"; printf '**Failed derivation:** %s\n\n%s\n%s\n%s\n' "$name" '```' "$(cat "$out/$name.errors.txt")" '```' >> "$GITHUB_STEP_SUMMARY"; else rm -f "$out/$name.log"; echo "No stored build log for $name. It probably failed because a dependency failed."; fi; done < <(grep -oP "(Cannot build '|builder for '|nix log |nix-store -l )\K/nix/store/[0-9a-z]{32}-[^' ]+\.drv" "$log" | awk '!seen[$0]++'); [ "$found" -eq 0 ] && { echo "No failed derivation log found. The failure is probably an evaluation error."; tail -n 80 "$log" > "$out/eval-error.txt"; cat "$out/eval-error.txt"; printf '%s\n%s\n%s\n' '```' "$(cat "$out/eval-error.txt")" '```' >> "$GITHUB_STEP_SUMMARY"; }; exit 0

      - name: Upload logs of failed derivations
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: failed-derivation-logs
          path: ${{ runner.temp }}/failed-logs
          retention-days: 7

      - name: Explicitly push all dependencies to Cachix
        run: |
          nix path-info -r ${{ steps.build.outputs.result }} --impure 2>/dev/null | cachix push kalishxern-nixos || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: /var/cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.run_id }}

      - name: Cleanup old ccache entries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key "ccache-${{ runner.os }}-" --limit 100 --json id,key,ref \
            | jq -r --arg current "${{ github.run_id }}" \
              '.[] | select(.key | contains($current) | not) | .id' \
            | xargs -r -n1 gh cache delete
